services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  MaxServ\App\:
    resource: "../src/*"

  MaxServ\App\Controller\:
    resource: "../src/Controller"
    public: true

  GuzzleHttp\Client:
    arguments:
      $config:
        timeout: 10

  MaxServ\App\Api\DummyJsonClient:
    public: true
